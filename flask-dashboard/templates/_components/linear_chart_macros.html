{% macro render_multi_line_chart(chart_id, height="300px", title="Grafico Andamento") %}
<div style="position: relative; height: {{ height }};">
  <canvas id="{{ chart_id }}"></canvas>
</div>

<div class="mt-2">
  <button class="btn btn-sm btn-outline-secondary" id="{{ chart_id }}-download-pdf">
    Esporta in PDF
  </button>
</div>
{% endmacro %}
