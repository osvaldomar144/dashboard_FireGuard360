{% extends "layout_login.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container-fluid h-custom">
  <div class="row d-flex justify-content-center align-items-center h-100">
    <div class="col-md-9 col-lg-6 col-xl-5">
      <div class="image-container text-center mb-4">
        <img src="{{ url_for('static', filename='images/login/login_background.png') }}" class="custom-image" alt="FireGuard360 Illustration" style="width: 100%; max-width: 600px; height: auto;">
      </div>
    </div>
    <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
      <div class="login-card shadow p-4 rounded bg-white">
        <form method="POST">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Accedi a FireGuard360</h3>
          </div>

          <div class="form-outline mb-4">
            <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Nome utente" required />
          </div>

          <div class="form-outline mb-3">
            <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Password" required />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"> Ricordami </label>
            </div>
            <a href="#" class="text-body">Password dimenticata?</a>
          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary btn-lg w-100">Accedi</button>
            <p class="small fw-bold mt-2 pt-1 mb-0">
              Non hai un account? <a href="#" class="link-danger">Registrati</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
